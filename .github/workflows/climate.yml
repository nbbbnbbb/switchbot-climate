name: Collect and publish climate

on:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/climate.yml']
  workflow_dispatch:
    inputs:
      continuous:
        description: Restart automatically after the long sampling session
        type: boolean
        default: true
      samples:
        description: Legacy dispatch compatibility (collection now runs continuously)
        type: choice
        options: ['5', '2', '1']
        default: '5'

permissions:
  contents: read

concurrency:
  group: climate-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Test collector and scheduling
        run: python3 -m unittest discover -s tests -v
      - name: Continuous two-minute collection
        id: collect
        env:
          SWITCHBOT_TOKEN: ${{ secrets.SWITCHBOT_TOKEN }}
          SWITCHBOT_SECRET: ${{ secrets.SWITCHBOT_SECRET }}
          SWITCHBOT_DEVICES: ${{ secrets.SWITCHBOT_DEVICES }}
        run: python3 scripts/continuous_collect.py
      - name: Restart the next long sampling session
        if: always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.continuous)
        env:
          GH_TOKEN: ${{ github.token }}
          CLIMATE_SAMPLE_COUNT: '1'
          CLIMATE_WINDOW_START: '0'
        run: python3 scripts/dispatch_next.py
