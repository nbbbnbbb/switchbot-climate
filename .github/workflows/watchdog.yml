name: Recover stalled climate collection

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: climate-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Check freshness and recover the collector
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/watchdog.py
