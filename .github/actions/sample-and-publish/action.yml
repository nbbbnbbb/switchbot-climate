name: Sample and publish
description: Collect a two-minute sample and publish it immediately
inputs:
  slot:
    description: Sample slot within the ten-minute window, from 1 to 5
    required: true
  configured:
    description: Whether SwitchBot credentials are present
    required: true
  token:
    description: SwitchBot token
    required: false
  secret:
    description: SwitchBot secret
    required: false
  devices:
    description: Optional device configuration
    required: false
outputs:
  page_url:
    description: Published site URL
    value: ${{ steps.deploy.outputs.page_url }}
runs:
  using: composite
  steps:
    - name: Wait for two-minute sample slot
      id: timing
      shell: bash
      env:
        SAMPLE_SLOT: ${{ inputs.slot }}
      run: python3 scripts/wait_for_slot.py "$SAMPLE_SLOT"
    - name: Collect readings
      id: collect
      if: steps.timing.outputs.due == 'true' && inputs.configured == 'true'
      continue-on-error: true
      shell: bash
      env:
        SWITCHBOT_TOKEN: ${{ inputs.token }}
        SWITCHBOT_SECRET: ${{ inputs.secret }}
        SWITCHBOT_DEVICES: ${{ inputs.devices }}
      run: python3 scripts/collect.py
    - name: Save public readings
      if: steps.timing.outputs.due == 'true' && inputs.configured == 'true'
      shell: bash
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add docs/data
        if ! git diff --cached --quiet; then
          git commit -m 'Update public climate readings'
          git push
        fi
    - name: Upload sample site
      if: steps.timing.outputs.due == 'true'
      uses: actions/upload-pages-artifact@v4
      with:
        name: github-pages-${{ inputs.slot }}
        path: docs
        retention-days: 1
    - name: Deploy sample site
      id: deploy
      if: steps.timing.outputs.due == 'true'
      uses: actions/deploy-pages@v4
      with:
        artifact_name: github-pages-${{ inputs.slot }}
    - name: Report collection failure after publishing status
      if: steps.collect.outcome == 'failure'
      shell: bash
      run: |
        echo 'Collection failed. Last successful readings and an error status have been published.'
        exit 1
